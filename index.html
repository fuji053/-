<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="バトル試作">
<meta name="theme-color" content="#0b1022">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>バトル試作</title>
<style>
  :root {
    --bg: #0b1022;
    --panel: rgba(16, 22, 44, 0.94);
    --line: rgba(255, 255, 255, 0.14);
    --text: #f2f4ff;
    --muted: #9aa3c7;
    --p1: #ff5d5d;
    --cpu: #4fa8ff;
    --accent: #ffd34d;
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    padding: var(--sat) var(--sar) var(--sab) var(--sal); }

  .screen {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: calc(12px + var(--sat)) calc(16px + var(--sar)) calc(12px + var(--sab)) calc(16px + var(--sal));
    background: radial-gradient(ellipse at 50% 30%, #1b2550 0%, #0b1022 70%);
    z-index: 10;
  }
  .screen.show { display: flex; }
  .screen.overlay { background: rgba(5, 8, 20, 0.72); }
  .box { width: min(720px, 100%); max-height: 100%; overflow: auto; text-align: center; }
  h1 { font-size: clamp(30px, 7vh, 52px); margin: 0 0 6px; letter-spacing: 0.06em; }
  h2 { font-size: 22px; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.6; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: #222c58; color: var(--text);
    font: inherit; font-size: 18px; font-weight: 700; padding: 12px 26px; border-radius: 14px;
    margin: 6px; min-width: 170px; touch-action: manipulation;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: #1a1400; border-color: transparent; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .sel-wrap { display: flex; gap: 14px; justify-content: center; }
  .sel-col { flex: 1; min-width: 0; }
  .sel-col h3 { margin: 0 0 8px; font-size: 15px; }
  .sel-col.p1 h3 { color: var(--p1); }
  .sel-col.cpu h3 { color: var(--cpu); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {
    border: 2px solid var(--line); border-radius: 12px; padding: 8px 6px; background: #151c3b;
    font-size: 15px; font-weight: 700; touch-action: manipulation;
  }
  .card small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .sel-col.p1 .card.on { border-color: var(--p1); background: #3a1c2a; }
  .sel-col.cpu .card.on { border-color: var(--cpu); background: #162c4c; }
  .menu .btn { display: block; width: 260px; margin: 8px auto; }
  .lv-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .segs { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg { padding: 7px 16px; font-size: 14px; font-weight: 700; color: var(--text); background: #151c3b; touch-action: manipulation; }
  .seg + .seg { border-left: 1px solid var(--line); }
  .seg.on { background: var(--cpu); color: #04122a; }
  canvas#game3d { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; }
  #result h1 { font-size: clamp(28px, 8vh, 48px); }
  #rotate { z-index: 50; background: var(--bg); }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>

<!-- タイトル -->
<div class="screen show" id="title">
  <div class="box">
    <h1>バトル試作</h1>
    <p class="sub">仮のキャラで操作感と吹っ飛びを試す版です<br>iPhoneは横向き・低電力モードはオフで遊んでください</p>
    <button class="btn primary" id="btnStart">はじめる</button>
  </div>
</div>

<!-- キャラ選択 -->
<div class="screen" id="select">
  <div class="box">
    <h2>キャラを選んでください</h2>
    <div class="sel-wrap">
      <div class="sel-col p1"><h3>あなた</h3><div class="cards" id="cardsP1"></div></div>
      <div class="sel-col cpu"><h3>CPU</h3><div class="cards" id="cardsCPU"></div></div>
    </div>
    <div class="lv-row"><span>CPUの強さ</span><div class="segs" id="cpuLevel"></div></div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="btnBack">もどる</button>
      <button class="btn primary" id="btnFight">たたかう</button>
    </div>
  </div>
</div>

<!-- 一時停止 -->
<div class="screen overlay" id="pause">
  <div class="box menu">
    <h2>一時停止</h2>
    <button class="btn primary" id="btnResume">つづける</button>
    <button class="btn" id="btnRestart">最初からやり直す</button>
    <button class="btn" id="btnToSelect">キャラ選択へ</button>
    <button class="btn" id="btnFps">fps表示：オフ</button>
  </div>
</div>

<!-- 結果 -->
<div class="screen overlay" id="result">
  <div class="box menu">
    <h1 id="resultText">勝ち！</h1>
    <button class="btn primary" id="btnAgain">もう一度</button>
    <button class="btn" id="btnResSelect">キャラ選択へ</button>
  </div>
</div>

<!-- 縦向きのとき -->
<div class="screen" id="rotate">
  <div class="box"><h2>iPhoneを横向きにしてください</h2></div>
</div>

<script src="data.js"></script>
<script src="three.min.js"></script>
<script src="render3d.js"></script>
<script src="game.js"></script>
</body>
</html>
